
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KITCHOL Mart</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7f5;color:#222}
header{background:#168447;color:white;padding:22px;text-align:center}
header h1{margin:0}
main{max-width:440px;margin:25px auto;padding:18px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 12px #ddd}
input,select,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{background:#168447;color:white;border:0;font-weight:bold}
.note{text-align:center;color:#666;font-size:13px}
#message{color:#168447;text-align:center}
</style>
</head>
<body>
<header>
<h1>KITCHOL Mart</h1>
<p>Your Local Grocery Marketplace</p>
</header>
<main>
<div class="card">
<h2>Welcome</h2>
<p>Create account or Login</p>

<select id="role">
<option value="customer">Customer</option>
<option value="vendor">Vendor</option>
</select>

<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">

<button id="register">Create Account</button>
<button id="login">Login</button>
<button id="logout">Logout</button>

<p id="message">Ready to start</p>
<p class="note">KITCHOL Mart Multi-Vendor Marketplace</p>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword,
signInWithEmailAndPassword, signOut } from
"https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from
"https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDmAmX0wfWk-SrBz5ikKnULpMGd3zNrIZo",
authDomain: "kitchol-mart-1b270.firebaseapp.com",
projectId: "kitchol-mart-1b270",
storageBucket: "kitchol-mart-1b270.firebasestorage.app",
messagingSenderId: "631334576857",
appId: "1:631334576857:web:d3b3312bcdc12e472194c8",
measurementId: "G-X1WF357YJG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const msg = document.getElementById("message");

document.getElementById("register").onclick = async () => {
try {
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;
const role = document.getElementById("role").value;

const result = await createUserWithEmailAndPassword(auth,email,password);

await setDoc(doc(db,"users",result.user.uid),{
email: email,
role: role,
status: role === "vendor" ? "pending" : "active",
createdAt: new Date()
});

msg.textContent = role === "vendor"
? "Vendor account created. Waiting for approval."
: "Customer account created successfully!";
} catch(e) {
msg.textContent = e.message;
}
};

document.getElementById("login").onclick = async () => {
try {
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;
await signInWithEmailAndPassword(auth,email,password);
msg.textContent = "Login successful!";
} catch(e) {
msg.textContent = e.message;
}
};

document.getElementById("logout").onclick = async () => {
try {
await signOut(auth);
msg.textContent = "Logged out successfully.";
} catch(e) {
msg.textContent = e.message;
}
};
</script>
</body>
</html>
