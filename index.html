<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KITCHOL Mart</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f7f3;color:#183326}
header{background:#087b45;color:white;padding:25px 18px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:28px}
header p{margin-bottom:0}
main{padding:18px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
h2{font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:white;padding:15px;border-radius:15px}
.emoji{font-size:38px}
.price{color:#087b45;font-weight:bold}
button{background:#087b45;color:white;border:0;padding:11px 15px;border-radius:9px}
</style>
</head>
<body>
<header>
<h1>KITCHOL Mart</h1>
<p>Your Everyday Grocery Store</p>
</header>
<main>
<input id="search" placeholder="Search groceries..." oninput="filterItems()">
<h2>Shop Categories</h2>
<div class="grid" id="products">
<div class="item"><div class="emoji">🥬</div><h3>Vegetables</h3><p class="price">Starting ₹20</p><button onclick="add()">Add to Cart</button></div>
<div class="item"><div class="emoji">🍎</div><h3>Fruits</h3><p class="price">Starting ₹30</p><button onclick="add()">Add to Cart</button></div>
<div class="item"><div class="emoji">🥛</div><h3>Dairy</h3><p class="price">Starting ₹25</p><button onclick="add()">Add to Cart</button></div>
<div class="item"><div class="emoji">🍚</div><h3>Rice & Grains</h3><p class="price">Starting ₹50</p><button onclick="add()">Add to Cart</button></div>
</div>
<h2 id="cart">Cart: 0 Items</h2>
</main>
<script>
let count=0;
function add(){
count++;
document.getElementById('cart').innerText='Cart: '+count+' Items';
}
function filterItems(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.item').forEach(x=>{
x.style.display=x.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
