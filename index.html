
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITCHOL Mart</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7f5;
 color:#183326;
}
header{
 background:white;
 padding:18px;
 text-align:center;
 box-shadow:0 2px 8px #ddd;
}
.brand-logo{
 width:180px;
 max-width:70%;
 height:auto;
 display:block;
 margin:auto;
}
main{padding:16px;max-width:700px;margin:auto}
h2{font-size:20px}
.search{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:12px;
 font-size:16px;
 margin:12px 0;
}
.categories{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:8px 0;
}
.categories button{
 border:1px solid #087b45;
 background:white;
 color:#087b45;
 padding:11px 15px;
 border-radius:20px;
 white-space:nowrap;
}
.categories button.active{
 background:#087b45;
 color:white;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.product{
 background:white;
 padding:14px;
 border-radius:14px;
 box-shadow:0 2px 8px #ddd;
}
.product .photo{
 height:85px;
 background:#eaf5ed;
 border-radius:10px;
 display:grid;
 place-items:center;
 font-size:42px;
}
.product h3{font-size:16px;margin:10px 0 5px}
.price{color:#087b45;font-weight:bold}
button{
 cursor:pointer;
}
.add{
 width:100%;
 background:#087b45;
 color:white;
 border:0;
 padding:11px;
 border-radius:9px;
 margin-top:10px;
}
.panel{
 background:white;
 padding:16px;
 border-radius:14px;
 margin-top:18px;
}
.cart-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 border-bottom:1px solid #eee;
 padding:12px 0;
}
.qty button{
 background:#e8f5eb;
 border:0;
 padding:7px 12px;
 border-radius:6px;
 color:#087b45;
}
.field{
 width:100%;
 padding:13px;
 margin:7px 0 13px;
 border:1px solid #ddd;
 border-radius:9px;
 font-size:15px;
}
.checkout{
 width:100%;
 background:#087b45;
 color:white;
 border:0;
 padding:15px;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
}
#message{
 display:none;
 background:#e5f7e9;
 padding:15px;
 border-radius:10px;
 margin-top:15px;
 color:#087b45;
}
footer{
 text-align:center;
 padding:25px;
 color:#777;
}
</style>
</head>

<body>

<header>
<img src="logo.png" class="brand-logo" alt="KITCHOL Mart Logo">
</header>

<main>

<input class="search" id="search"
placeholder="🔍 Search groceries..."
oninput="renderProducts()">

<h2>Shop by Category</h2>

<div class="categories">
<button class="active" onclick="choose('All',this)">All</button>
<button onclick="choose('Vegetables',this)">🥦 Vegetables</button>
<button onclick="choose('Fruits',this)">🍎 Fruits</button>
<button onclick="choose('Dairy',this)">🥛 Dairy</button>
<button onclick="choose('Grocery',this)">🍚 Grocery</button>
</div>

<h2>Popular Products</h2>
<div class="grid" id="products"></div>

<section class="panel" id="cart">
<h2>🛒 My Shopping Cart</h2>
<div id="cartItems">Your cart is empty.</div>
<h3>Total: ₹<span id="total">0</span></h3>
</section>

<section class="panel">
<h2>📦 Delivery Details</h2>

<form id="orderForm">
<label>Customer Name</label>
<input class="field" id="customer" required
placeholder="Enter your name">

<label>Mobile Number</label>
<input class="field" id="mobile"
type="tel" pattern="[0-9]{10}" required
placeholder="10 digit mobile number">

<label>Delivery Address</label>
<textarea class="field" id="address"
required placeholder="Enter full delivery address"></textarea>

<button class="checkout" type="submit">
Place Order
</button>
</form>

<div id="message"></div>
</section>

</main>

<footer>
© 2026 KITCHOL Mart
<p>Your Everyday Grocery Store</p>
</footer>

<script>
const productsData=[
 {id:1,name:"Fresh Tomato",category:"Vegetables",price:30,emoji:"🍅"},
 {id:2,name:"Fresh Potato",category:"Vegetables",price:25,emoji:"🥔"},
 {id:3,name:"Fresh Onion",category:"Vegetables",price:35,emoji:"🧅"},
 {id:4,name:"Fresh Carrot",category:"Vegetables",price:40,emoji:"🥕"},
 {id:5,name:"Fresh Apple",category:"Fruits",price:120,emoji:"🍎"},
 {id:6,name:"Fresh Banana",category:"Fruits",price:40,emoji:"🍌"},
 {id:7,name:"Fresh Orange",category:"Fruits",price:60,emoji:"🍊"},
 {id:8,name:"Milk",category:"Dairy",price:30,emoji:"🥛"},
 {id:9,name:"Butter",category:"Dairy",price:55,emoji:"🧈"},
 {id:10,name:"Rice",category:"Grocery",price:60,emoji:"🍚"},
 {id:11,name:"Cooking Oil",category:"Grocery",price:140,emoji:"🫗"},
 {id:12,name:"Sugar",category:"Grocery",price:45,emoji:"🧂"}
];

let selectedCategory="All";
let cart={};

function choose(category,button){
 selectedCategory=category;
 document.querySelectorAll(".categories button")
 .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 renderProducts();
}

function renderProducts(){
 const search=document.getElementById("search").value.toLowerCase();
 const list=productsData.filter(p=>
 (selectedCategory==="All"||p.category===selectedCategory)&&
 p.name.toLowerCase().includes(search)
 );
 document.getElementById("products").innerHTML=
 list.map(p=>`
 <div class="product">
 <div class="photo">${p.emoji}</div>
 <h3>${p.name}</h3>
 <div class="price">₹${p.price}</div>
 <button class="add" onclick="add(${p.id})">Add to Cart</button>
 </div>`).join("");
}

function add(id){
 cart[id]=(cart[id]||0)+1;
 renderCart();
}

function changeQty(id,amount){
 cart[id]=(cart[id]||0)+amount;
 if(cart[id]<=0) delete cart[id];
 renderCart();
}

function renderCart(){
 let total=0;
 let html="";
 Object.keys(cart).forEach(id=>{
 const p=productsData.find(x=>x.id==id);
 const qty=cart[id];
 total+=p.price*qty;
 html+=`
 <div class="cart-row">
 <div>${p.emoji} ${p.name}<br>₹${p.price} × ${qty}</div>
 <div class="qty">
 <button onclick="changeQty(${id},-1)">−</button>
 ${qty}
 <button onclick="changeQty(${id},1)">+</button>
 </div>
 </div>`;
 });
 document.getElementById("cartItems").innerHTML=
 html||"Your cart is empty.";
 document.getElementById("total").textContent=total;
}

document.getElementById("orderForm").addEventListener("submit",function(e){
 e.preventDefault();

 if(Object.keys(cart).length===0){
 alert("Please add products to your cart first.");
 return;
 }

 const name=document.getElementById("customer").value;
 const total=document.getElementById("total").textContent;

 document.getElementById("message").style.display="block";
 document.getElementById("message").innerHTML=
 "<h3>✅ Order Request Created!</h3>"+
 "<p>Thank you, "+name+"!</p>"+
 "<p>Your order total is ₹"+total+"</p>"+
 "<p>This is a demo order. It has not been sent to a shop or admin.</p>";

 cart={};
 renderCart();
 this.reset();
});

renderProducts();
renderCart();
</script>

</body>
</html>
