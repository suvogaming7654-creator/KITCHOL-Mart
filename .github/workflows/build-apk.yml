
name: Build KITCHOL Mart APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kitchol/mart
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KITCHOL-Mart"
          include ':app'
          EOF

          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle

          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.kitchol.mart'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.kitchol.mart'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="KITCHOL Mart">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kitchol/mart/MainActivity.java <<'EOF'
          package com.kitchol.mart;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KITCHOL-Mart-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
